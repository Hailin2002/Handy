<!doctype html>
<!-- In-browser verification harness for prototype/meeting-mode.
     Covers the task-0179 leaf gates:
       G1 – accidental single stop press cannot end the mocked recording
       G2 – auto-scroll halts on user scroll-up, reveals "Zum aktuellen Text"
       G3 – colour semantics follow §6.8 (red only while truly recording,
            text+icon on every state)
       G4 – flows reachable from start-dialog completion (countdown →
            running view → confirmed stop → processing)
     plus regressions for task-0178 (§6.6 setup, §6.7 start dialog) and the
     task-0180 leaf gates (§6.12 checklist with deterministic counts and
     retry-failed, §6.5 list with click-reachable named-artifact delete,
     §6.13 detail tabs with transcript search jump and optional split view).
     Loads index.html into an iframe and writes "PASS"/"FAIL" lines into the
     DOM; run with:
       chrome-headless-shell --headless --no-sandbox --allow-file-access-from-files \
         --virtual-time-budget=60000 --dump-dom verify.html
     and grep the dumped DOM for PASS/FAIL and RESULT:. -->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>verify-running</title>
    <style>
      body {
        font-family: monospace;
        white-space: pre;
      }
      iframe {
        width: 1200px;
        height: 800px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="out">STARTING</div>
    <iframe id="app" src="index.html"></iframe>
    <script>
      "use strict";
      (function () {
        const out = [];
        function check(name, ok) {
          out.push((ok ? "PASS" : "FAIL") + "  " + name);
          if (!ok) window.__failed = true;
        }

        window.addEventListener("load", function () {
          const frame = document.getElementById("app");
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const $ = (id) => doc.getElementById(id);

          async function showRoute(route) {
            win.location.hash = "#/" + route;
            await sleep(50);
            return $("view-" + route);
          }
          async function startSessionFromDialog() {
            await showRoute("meetings");
            $("btn-neues-meeting").click();
            await sleep(30);
            $("btn-meeting-starten").click();
            await sleep(3300); // 3-Sekunden-Countdown abwarten
          }

          (async () => {
            try {
              await sleep(300);

              /* ---------- Bestand: Navigation aus Teil 1 ---------- */
              const areas = [
                "diktieren",
                "meetings",
                "projekte",
                "diktatverlauf",
                "einstellungen",
              ];
              for (const route of areas) {
                const view = await showRoute(route);
                check(
                  "nav: " + route + " visible",
                  view && !view.hidden && !!view.offsetParent,
                );
              }
              await showRoute("projekte");
              check(
                "only one view visible at a time",
                [...doc.querySelectorAll(".view")].filter((v) => !v.hidden)
                  .length === 1,
              );
              check(
                "pinned entry hidden initially",
                $("pinned-recording").hidden === true,
              );

              /* ---------- G4: Startdialog-Abschluss → Countdown → Laufendansicht ---------- */
              await showRoute("meetings");
              $("btn-neues-meeting").click();
              check("start dialog opens", !$("start-dialog").hidden);
              $("btn-meeting-starten").click();
              await sleep(60);

              // Countdown statt Sofort-Start; noch kein roter Aufnahmezustand (G3)
              check(
                "G4 countdown overlay shown after submit",
                !$("countdown-overlay").hidden,
              );
              check(
                "§6.9 countdown starts at 3",
                $("countdown-number").textContent === "3",
              );
              check(
                "G3 no recording state during countdown",
                $("pinned-recording").hidden && $("view-meeting-aktiv").hidden,
              );
              // Regression: Overlay liegt außerhalb der versteckten Ansicht → sichtbar
              check(
                "§6.9 countdown overlay actually rendered on screen",
                !$("countdown-overlay").hidden &&
                  !!doc.querySelector("#countdown-overlay .modal").offsetParent,
              );

              // Escape bricht nur den Countdown ab; Zustand landet zurück im Dialog
              doc.dispatchEvent(
                new win.KeyboardEvent("keydown", {
                  key: "Escape",
                  bubbles: true,
                }),
              );
              await sleep(50);
              check(
                "§6.9 Escape cancels countdown",
                $("countdown-overlay").hidden === true,
              );
              check(
                "§6.9 cancel returns to intact start dialog",
                !$("start-dialog").hidden,
              );
              check(
                "G3 nothing recorded after cancel",
                $("pinned-recording").hidden &&
                  win.location.hash.indexOf("meeting-aktiv") === -1,
              );

              // Erneut starten und Countdown auslaufen lassen
              $("btn-meeting-starten").click();
              await sleep(3300);
              check(
                "G4 countdown finishes into running view",
                $("countdown-overlay").hidden &&
                  !$("view-meeting-aktiv").hidden,
              );
              check(
                "G4 pinned entry appears with running session",
                !$("pinned-recording").hidden,
              );
              check(
                "G4 timer counts (" +
                  doc.querySelector(".pinned-time").textContent +
                  ")",
                /^00:00:0[1-9]/.test(
                  doc.querySelector(".pinned-time").textContent,
                ),
              );

              /* ---------- G3: Farbsemantik während echter Aufnahme ---------- */
              await showRoute("meeting-aktiv");
              const chip = $("live-status-chip");
              check(
                "G3 status bar chip red class while recording",
                chip.className.indexOf("status-recording") !== -1,
              );
              check(
                "G3 chip has icon + text",
                $("live-status-icon").textContent === "●" &&
                  $("live-status-text").textContent === "Aufnahme läuft",
              );
              check(
                "G3 chip colour is danger red",
                win.getComputedStyle(chip).color === "rgb(179, 38, 30)",
              );
              check(
                "G3 pinned dot red while recording",
                win.getComputedStyle(doc.querySelector(".rec-dot"))
                  .backgroundColor === "rgb(179, 38, 30)",
              );

              // Regression: Navigation schenkt der Aufnahme keine Sekunden
              const navBefore = doc
                .querySelector(".pinned-time")
                .textContent.slice(-2);
              for (const r of ["meetings", "projekte", "meeting-aktiv"]) {
                await showRoute(r);
                await sleep(20);
              }
              const navAfter = doc
                .querySelector(".pinned-time")
                .textContent.slice(-2);
              check(
                "navigation adds no phantom seconds to the timer",
                Math.abs(Number(navAfter) - Number(navBefore)) <= 1,
              );

              /* ---------- G2: Scroll-Lock + „Zum aktuellen Text“ ---------- */
              // Warten, bis der Transcript-Bereich überläuft (skriptete Segmente + Mock-Nachschub)
              let overflow = false;
              for (let i = 0; i < 200; i++) {
                const area = doc.querySelector(".transcript-area");
                if (area.scrollHeight > area.clientHeight) {
                  overflow = true;
                  break;
                }
                await sleep(100);
              }
              check(
                "G2 transcript area overflows with live segments",
                overflow,
              );
              const area = doc.querySelector(".transcript-area");
              area.scrollTop = 0;
              area.dispatchEvent(new win.Event("scroll"));
              await sleep(30);
              check(
                "G2 jump-to-current button revealed on scroll-up",
                $("btn-zum-text").hidden === false,
              );
              await sleep(1600); // neue Segmente kommen, während der Nutzer oben ist
              check(
                "G2 auto-scroll halted after user scrolled up",
                area.scrollTop <= 2 && area.scrollHeight > area.clientHeight,
              );
              $("btn-zum-text").click();
              await sleep(60);
              check(
                "G2 jump button scrolls to bottom and hides itself",
                area.scrollTop + area.clientHeight >= area.scrollHeight - 24 &&
                  $("btn-zum-text").hidden === true,
              );

              /* ---------- Pause mit Timeline-Marker (§6.11 / „Pause“) ---------- */
              $("btn-pause").click();
              await sleep(60);
              check(
                "pause switches chip to paused state (icon+text)",
                $("live-status-icon").textContent === "⏸" &&
                  $("live-status-text").textContent === "Pausiert" &&
                  $("live-status-chip").className.indexOf("status-paused") !==
                    -1,
              );
              check(
                "G3 paused chip is orange, not red",
                win.getComputedStyle($("live-status-chip")).color ===
                  "rgb(154, 91, 0)",
              );
              check(
                "G3 pinned entry shows orange paused state",
                doc.querySelector(".pinned-label").textContent === "Pausiert" &&
                  $("pinned-recording").classList.contains("is-paused") &&
                  win.getComputedStyle(doc.querySelector(".rec-dot"))
                    .backgroundColor === "rgb(154, 91, 0)",
              );
              check(
                "pause writes timeline marker",
                [
                  ...doc.querySelectorAll("#live-segments .timeline-marker"),
                ].some((li) => /Pausiert/.test(li.textContent)),
              );
              check(
                "levels drop to zero while paused",
                $("mic-level").value === 0 && $("sys-level").value === 0,
              );
              const frozen = doc.querySelector(".pinned-time").textContent;
              await sleep(1400);
              check(
                "duration freezes while paused",
                doc.querySelector(".pinned-time").textContent === frozen,
              );

              $("btn-pause").click(); // Fortsetzen
              await sleep(60);
              check(
                "resume restores recording state (red + icon + text)",
                $("live-status-text").textContent === "Aufnahme läuft" &&
                  $("live-status-chip").className.indexOf(
                    "status-recording",
                  ) !== -1 &&
                  win.getComputedStyle($("live-status-chip")).color ===
                    "rgb(179, 38, 30)",
              );
              check(
                "resume writes timeline marker",
                [
                  ...doc.querySelectorAll("#live-segments .timeline-marker"),
                ].some((li) => /Fortgesetzt/.test(li.textContent)),
              );

              /* ---------- G1: Ein einzelner Druck beendet nie direkt ---------- */
              $("btn-beenden").click();
              await sleep(30);
              check(
                "G1 stop press only opens confirmation",
                !$("stop-confirm").hidden && !$("pinned-recording").hidden,
              );
              doc.dispatchEvent(
                new win.KeyboardEvent("keydown", {
                  key: "Escape",
                  bubbles: true,
                }),
              );
              await sleep(30);
              check(
                "G1 Escape cancels stop, recording continues",
                $("stop-confirm").hidden && !$("pinned-recording").hidden,
              );
              $("btn-beenden").click();
              await sleep(30);
              $("btn-stop-abbruch").click();
              await sleep(30);
              check(
                "G1 explicit 'Weiter aufnehmen' keeps recording",
                $("stop-confirm").hidden && !$("pinned-recording").hidden,
              );

              /* ---------- G1/§6.9: Bestätigung läuft ohne Zustandsänderung ab ---------- */
              $("btn-beenden").click();
              await sleep(10400);
              check(
                "§6.9 confirmation auto-dismisses without stopping",
                $("stop-confirm").hidden && !$("pinned-recording").hidden,
              );

              /* ---------- G1/§6.9: bestätigtes Beenden → Verarbeitung (G4) ---------- */
              $("btn-beenden").click();
              await sleep(30);
              $("btn-stop-ok").click();
              await sleep(200);
              check(
                "G4 confirmed stop reaches processing view",
                !$("view-verarbeitung").hidden && $("pinned-recording").hidden,
              );
              await sleep(3700);
              check(
                "checklist completes",
                doc.querySelector('#proc-checklist li[data-step="summary"]')
                  .className === "done",
              );
              await showRoute("meetings");
              check(
                "finished meeting appears in list",
                doc.querySelectorAll("#meeting-list .meeting-item").length >= 3,
              );

              /* ===== Regression: task-0178 Blatt (§6.6 Ersteinrichtung + §6.7 Startdialog) ===== */

              // Setup screen navigable from scaffold
              await showRoute("meetings");
              $("btn-open-setup").click();
              await sleep(80);
              check(
                "reg-0178 setup view reachable",
                !$("view-meeting-einrichtung").hidden,
              );
              check(
                "§6.6 provider default 'Lokal' preselected",
                doc.querySelector('input[name="setup-provider"][value="lokal"]')
                  .checked,
              );
              const moreOpts = doc.querySelector(
                "#view-meeting-einrichtung details.more-options",
              );
              check(
                "§6.6 Custom sits under 'Weitere Optionen'",
                !!moreOpts &&
                  !moreOpts.open &&
                  !!moreOpts.querySelector(
                    'input[name="setup-provider"][value="custom"]',
                  ),
              );

              // Audio test with live-level mock + correction action
              $("btn-test-mic").click();
              await sleep(300);
              check(
                "§6.6 mic test shows live level",
                Number($("setup-mic-level").value) > 0,
              );
              await sleep(2200);
              check(
                "§6.6 mic test passes",
                /funktioniert/.test($("result-mic").textContent),
              );
              $("btn-test-sys").click();
              await sleep(2200);
              check(
                "§6.6 system test confirms loopback",
                /Loopback empfängt/.test($("result-sys").textContent),
              );
              $("sim-no-mic").checked = true;
              $("btn-test-mic").click();
              await sleep(50);
              check(
                "§6.6 missing device yields fail status + correction action",
                /Kein Mikrofon erkannt/.test($("result-mic").textContent) &&
                  !$("setup-audio-hints").hidden &&
                  !!doc.querySelector("#setup-audio-hints button[data-fix]"),
              );
              $("sim-no-mic").checked = false;

              // Shortcut candidate availability
              await sleep(700);
              check(
                "§6.6 shortcut candidate available",
                /verfügbar/.test($("shortcut-cand-status").textContent),
              );
              $("sim-shortcut-taken").checked = true;
              $("btn-shortcut-check").click();
              await sleep(700);
              check(
                "§6.6 taken candidate offers alternatives",
                !$("shortcut-alternatives").hidden &&
                  doc.querySelectorAll(".alt-pick").length >= 2,
              );
              $("sim-shortcut-taken").checked = false;

              // Finish lands directly in compact start dialog
              $("btn-setup-finish").click();
              await sleep(100);
              check(
                "§6.6 finish opens compact start dialog",
                !$("start-dialog").hidden,
              );

              // Rows clickable, scoped pickers, dialog state preserved
              const titleBefore = $("meeting-title-input").value;
              for (const row of ["mic", "sys", "provider", "lang"]) {
                $("row-" + row).click();
                await sleep(30);
                check(
                  "reg-0178 row '" + row + "' opens scoped picker",
                  !$("row-picker").hidden &&
                    doc.querySelectorAll("#row-picker .picker-option").length >
                      0,
                );
                doc.querySelector("#row-picker .picker-back").click();
                await sleep(30);
                check(
                  "reg-0178 row '" + row + "' returns to intact dialog",
                  $("row-picker").hidden === true && !$("start-dialog").hidden,
                );
              }
              check(
                "reg-0178 dialog state preserved (title unchanged)",
                $("meeting-title-input").value === titleBefore,
              );

              // 'Kein Projekt' selectable and visibly distinct
              $("project-chip").click();
              await sleep(30);
              const noneOpt = doc.querySelector(
                "#project-picker .picker-none-opt",
              );
              check(
                "G2(reg) 'Kein Projekt' option present and dashed",
                !!noneOpt &&
                  win.getComputedStyle(noneOpt).borderStyle === "dashed" &&
                  /Eingang/.test(noneOpt.textContent),
              );
              [...doc.querySelectorAll("#project-picker .picker-option")]
                .find((b) => b.textContent.indexOf("BDNA Club") !== -1)
                .click();
              await sleep(30);
              check(
                "reg-0178 project selection reflects on chip",
                $("project-chip").textContent.trim() === "BDNA Club",
              );
              doc.querySelector("#project-picker .picker-none-opt").click();
              await sleep(30);
              check(
                "reg-0178 'Kein Projekt' selectable again",
                $("project-chip").textContent.trim() === "Kein Projekt" &&
                  $("project-chip").classList.contains("chip-none"),
              );

              // Start disabled for mocked missing device, fixable in-place
              $("row-mic").click();
              await sleep(30);
              [...doc.querySelectorAll("#row-picker .picker-sim")]
                .find((b) => b.textContent.indexOf("Gerät entfernen") !== -1)
                .click();
              await sleep(30);
              check(
                "G3(reg) start disabled while mic missing",
                $("btn-meeting-starten").disabled === true,
              );
              check(
                "G3(reg) blocker names fix location",
                !$("start-blocker").hidden &&
                  /Mikrofon/.test($("start-blocker").textContent),
              );
              [...doc.querySelectorAll("#row-picker .picker-option")]
                .find((b) => b.textContent.indexOf("Standardmikrofon") !== -1)
                .click();
              await sleep(30);
              check(
                "G3(reg) fixed in place; start enabled, dialog intact",
                $("btn-meeting-starten").disabled === false &&
                  !$("start-dialog").hidden,
              );

              // Cloud provider without key
              $("row-provider").click();
              await sleep(30);
              [...doc.querySelectorAll("#row-picker .picker-option")]
                .find((b) => b.textContent.indexOf("Azure Cloud") !== -1)
                .click();
              await sleep(30);
              check(
                "G3(reg) azure without key disables start",
                $("btn-meeting-starten").disabled === true,
              );
              [...doc.querySelectorAll("#row-picker .picker-sim")]
                .find(
                  (b) => b.textContent.indexOf("Schlüssel hinzufügen") !== -1,
                )
                .click();
              await sleep(30);
              check(
                "G3(reg) adding key re-enables start",
                $("btn-meeting-starten").disabled === false,
              );

              // Escape first closes only the picker
              $("row-lang").click();
              await sleep(30);
              doc.dispatchEvent(
                new win.KeyboardEvent("keydown", {
                  key: "Escape",
                  bubbles: true,
                }),
              );
              await sleep(30);
              check(
                "reg-0178 Escape closes picker but keeps dialog",
                $("row-picker").hidden === true && !$("start-dialog").hidden,
              );
              await sleep(30);
              doc.dispatchEvent(
                new win.KeyboardEvent("keydown", {
                  key: "Escape",
                  bubbles: true,
                }),
              );
              await sleep(30);

              /* ===== task-0180 Blatt: §6.5 Liste, §6.12 Checkliste, §6.13 Detail ===== */
              // Lösch-Bestätigungen im Mock automatisch annehmen
              win.confirm = function () {
                return true;
              };

              /* --- G4: Liste -> Detail -> zurück --- */
              await showRoute("meetings");
              check(
                "G4(list) populated list renders cards",
                doc.querySelectorAll("#meeting-list .card-open").length >= 3,
              );
              doc.querySelector("#meeting-list .card-open").click();
              await sleep(80);
              check(
                "G4 list card opens detail view",
                !$("view-meeting-detail").hidden && $("view-meetings").hidden,
              );
              check(
                "§6.13 detail defaults to Übersicht tab",
                !doc.querySelector('[data-dpanel="uebersicht"]').hidden &&
                  doc.querySelector('[data-dpanel="transkript"]').hidden &&
                  doc
                    .querySelector('[data-dtab="uebersicht"]')
                    .getAttribute("aria-selected") === "true",
              );
              $("btn-detail-back").click();
              await sleep(60);
              check(
                "G4 detail back returns to list",
                !$("view-meetings").hidden && $("view-meeting-detail").hidden,
              );

              /* --- G3: Transkript-Suche springt zur Segmentposition --- */
              [...doc.querySelectorAll("#meeting-list .card-open")]
                .find((b) => b.textContent.indexOf("Wochenplanung") !== -1)
                .click();
              await sleep(80);
              doc.querySelector('[data-dtab="transkript"]').click();
              await sleep(30);
              doc.getElementById("detail-transcript-area").style.maxHeight =
                "120px";
              $("detail-transcript-search").value = "Messestand";
              $("detail-transcript-search").dispatchEvent(
                new win.Event("input", { bubbles: true }),
              );
              await sleep(50);
              const firstHit = doc.querySelector(
                "#detail-segments .seg-hit-first",
              );
              check(
                "G3 search jumps to mocked segment position",
                !!firstHit &&
                  doc.activeElement === firstHit &&
                  firstHit.dataset.pos === "0:06" &&
                  doc.getElementById("detail-transcript-area").scrollTop > 2 &&
                  /Segment 3 von 9/.test(
                    $("transcript-search-status").textContent,
                  ),
              );
              doc.getElementById("detail-transcript-area").style.maxHeight = "";

              /* --- G2: Löschen ohne Hover mit benannten Artefakten --- */
              await showRoute("meetings");
              const itemsBefore = doc.querySelectorAll(
                "#meeting-list .meeting-item",
              ).length;
              doc.querySelectorAll("#meeting-list .menu-btn")[1].click();
              await sleep(40);
              const dangerBtn = doc.querySelector(
                "#meeting-list .menu .menu-danger",
              );
              check(
                "G2 three-dot delete reachable by click (no hover)",
                !!dangerBtn && getComputedStyle(dangerBtn).display !== "none",
              );
              if (dangerBtn) {
                const menuTitle = doc
                  .querySelectorAll("#meeting-list .card-open")[1]
                  .textContent.split("·")[0]
                  .trim();
                let askedMsg = "";
                win.confirm = function (msg) {
                  askedMsg = msg;
                  return true;
                };
                dangerBtn.click();
                await sleep(50);
                check(
                  "G2 delete asks naming Audio/Transkript/Zusammenfassung + title",
                  /Audio,\s*Transkript und Zusammenfassung/.test(askedMsg) &&
                    askedMsg.indexOf(menuTitle) !== -1,
                );
                win.confirm = function () {
                  return true;
                };
                check(
                  "G2 confirmed delete removes the meeting",
                  doc.querySelectorAll("#meeting-list .meeting-item").length ===
                    itemsBefore - 1,
                );
              }

              /* --- G1: deterministische Stückzahlen, nie Prozent --- */
              $("btn-neues-meeting").click();
              await sleep(30);
              $("btn-meeting-starten").click();
              await sleep(3400);
              $("btn-beenden").click();
              await sleep(30);
              $("btn-stop-ok").click();
              await sleep(250);
              const earlyChunks = doc.querySelector(
                '#proc-checklist li[data-step="chunks"]',
              ).textContent;
              const earlyHtml = $("proc-checklist").innerHTML;
              check(
                "G1 while total unknown: no count, no percentage",
                earlyChunks.indexOf("%") === -1 && !/\d/.test(earlyChunks),
              );
              await sleep(3600);
              const lateTr = doc.querySelector(
                '#proc-checklist li[data-step="transcribe"]',
              );
              const lateCk = lateTr.textContent.match(
                /^✓ (\d+) von (\d+) Abschnitten transkribiert$/,
              );
              check(
                "G1 deterministic n von n counts, checklist completes, no percentage",
                !!lateCk &&
                  lateCk[1] === lateCk[2] &&
                  doc.querySelector('#proc-checklist li[data-step="summary"]')
                    .className === "done" &&
                  $("proc-checklist").innerHTML.indexOf("%") === -1,
              );

              /* --- §6.12: fehlerhafte Abschnitte erneut versuchen --- */
              $("sim-chunk-error").checked = true;
              await showRoute("meetings");
              await showRoute("verarbeitung");
              await sleep(300);
              $("btn-proc-bg").click();
              await sleep(80);
              check(
                "§6.12 background-continue returns to list",
                !$("view-meetings").hidden &&
                  [...doc.querySelectorAll("#meeting-list .status-chip")].some(
                    (c) => /In Verarbeitung/.test(c.textContent),
                  ),
              );
              await showRoute("verarbeitung");
              await sleep(2900);
              check(
                "§6.12 failed chunk shows error state + retry action",
                doc.querySelector('#proc-checklist li[data-step="transcribe"]')
                  .className === "error" && !$("btn-retry-failed").hidden,
              );
              $("btn-retry-failed").click();
              await sleep(2000);
              check(
                "§6.12 retry completes processing, opens detail entry",
                doc.querySelector('#proc-checklist li[data-step="summary"]')
                  .className === "done" &&
                  !$("btn-open-processing-meeting").hidden,
              );
              $("btn-open-processing-meeting").click();
              await sleep(80);
              check(
                "§6.13 finished meeting detail reached from checklist",
                !$("view-meeting-detail").hidden &&
                  /Fertig/.test($("detail-status-chip").textContent),
              );

              /* --- §6.13: optionale Geteilte Ansicht --- */
              check(
                "§6.13 split view offered wide / not default",
                getComputedStyle(doc.querySelector(".split-toggle")).display !==
                  "none" &&
                  !$("view-meeting-detail").classList.contains("split-active"),
              );
              $("split-toggle").checked = true;
              $("split-toggle").click();
              await sleep(60);
              const splitOn =
                $("view-meeting-detail").classList.contains("split-active") &&
                !doc.querySelector('[data-dpanel="transkript"]').hidden;
              $("split-toggle").checked = false;
              $("split-toggle").click();
              await sleep(60);
              check(
                "§6.13 split view toggles side-by-side and back",
                splitOn &&
                  !$("view-meeting-detail").classList.contains(
                    "split-active",
                  ) &&
                  doc.querySelector('[data-dpanel="transkript"]').hidden,
              );
              $("sim-chunk-error").checked = false;

              out.forEach((l) => {
                const d = document.createElement("div");
                d.textContent = l;
                document.body.appendChild(d);
              });
              const summary = document.createElement("div");
              summary.id = "summary";
              summary.textContent = window.__failed
                ? "RESULT: FAIL"
                : "RESULT: PASS";
              document.body.appendChild(summary);
              document.title = summary.textContent;
            } catch (e) {
              const d = document.createElement("div");
              d.id = "harness-error";
              d.textContent = "HARNESS ERROR: " + ((e && e.stack) || e);
              document.body.appendChild(d);
              document.title = "HARNESS ERROR";
            }
          })();
        });
      })();
    </script>
  </body>
</html>
