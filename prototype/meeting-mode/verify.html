<!DOCTYPE html>
<!-- In-browser verification harness for prototype/meeting-mode (Gates G1, G2).
     Loads index.html into an iframe and runs the acceptance checks inside the
     browser, so no inter-process debugging channel (named pipe / TCP CDP) is
     needed. Results are written into the DOM as "PASS <name>" / "FAIL <name>"
     lines; run with:
       chrome-headless-shell --headless --allow-file-access-from-files \
         --virtual-time-budget=25000 --dump-dom verify.html
     and grep the dumped DOM for PASS/FAIL. -->
<html lang="de">
<head>
<meta charset="UTF-8">
<title>verify-running</title>
<style>
  body { font-family: monospace; white-space: pre; }
  iframe { width: 1200px; height: 800px; border: 0; }
</style>
</head>
<body>
<div id="out">STARTING</div>
<iframe id="app" src="index.html"></iframe>
<script>
"use strict";
(function () {
  const out = [];
  function check(name, ok) {
    out.push((ok ? "PASS" : "FAIL") + "  " + name);
    if (!ok) window.__failed = true;
  }

  window.addEventListener("load", function () {
    const frame = document.getElementById("app");
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function showRoute(route) {
      win.location.hash = "#/" + route;
      await sleep(50);
      return doc.getElementById("view-" + route);
    }

    (async () => {
      try {
        await sleep(300);

        // G1: navigation between the five areas
        const areas = ["diktieren", "meetings", "projekte", "diktatverlauf", "einstellungen"];
        for (const route of areas) {
          const view = await showRoute(route);
          check("G1 nav: " + route + " visible",
                view && !view.hidden && !!view.offsetParent);
        }
        // exactly one view visible at a time
        await showRoute("projekte");
        check("G1 only one view visible at a time",
              [...doc.querySelectorAll(".view")].filter((v) => !v.hidden).length === 1);

        // aria-current follows route
        check("aria-current set on active nav item",
              doc.querySelector('.nav-item[data-route="projekte"]').getAttribute("aria-current") === "page");

        // G2: pinned entry hidden while no session
        check("G2 pinned entry hidden initially",
              doc.getElementById("pinned-recording").hidden === true);

        // Start a mocked session via the start dialog
        await showRoute("meetings");
        doc.getElementById("btn-neues-meeting").click();
        check("start dialog opens", !doc.getElementById("start-dialog").hidden);
        doc.getElementById("btn-meeting-starten").click();

        // G2: pinned entry visible with red dot and running timer
        await sleep(1300);
        const pin = doc.getElementById("pinned-recording");
        const dotColor = win.getComputedStyle(pin.querySelector(".rec-dot")).backgroundColor;
        const timer = pin.querySelector(".pinned-time").textContent;
        check("G2 pinned entry visible during session", !pin.hidden);
        check("G2 pinned label 'Aufnahme läuft'",
              pin.querySelector(".pinned-label").textContent === "Aufnahme läuft");
        check("G2 red status dot", dotColor === "rgb(179, 38, 30)");
        check("G2 timer counts up (" + timer + ")", /^00:00:0[1-9]/.test(timer));
        check("G2 pinned entry sits directly under Meetings",
              pin.previousElementSibling.querySelector(".nav-item").dataset.route === "meetings");

        // Pinned entry navigates to running-meeting view
        doc.querySelector(".nav-pinned").click();
        await sleep(100);
        check("pinned entry navigates to meeting-aktiv view",
              !doc.getElementById("view-meeting-aktiv").hidden);

        // Stop flow: confirm dialog, processing checklist, pin gone
        doc.getElementById("btn-beenden").click();
        check("stop confirmation shown", !doc.getElementById("stop-confirm").hidden);
        doc.getElementById("btn-stop-ok").click();
        await sleep(200);
        check("pin hidden after stop",
              doc.getElementById("pinned-recording").hidden === true);
        check("processing view reached",
              !doc.getElementById("view-verarbeitung").hidden);
        await sleep(3600);
        check("checklist completes",
              doc.querySelector('#proc-checklist li[data-step="summary"]').className === "done");
        await showRoute("meetings");
        check("finished meeting appears in list",
              doc.querySelectorAll("#meeting-list .meeting-item").length >= 3);

        // Settings tabs work
        await showRoute("einstellungen");
        doc.querySelector('.tab[data-tab="modelle"]').click();
        check("settings tab switch works",
              !doc.querySelector('.tabpanel[data-panel="modelle"]').hidden &&
              doc.querySelector('.tab[data-tab="modelle"]').getAttribute("aria-selected") === "true");

        // Escape closes start dialog without starting
        await showRoute("meetings");
        doc.getElementById("btn-neues-meeting").click();
        doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(50);
        check("Escape closes start dialog",
              doc.getElementById("start-dialog").hidden === true);

        /* ===== task-0178 Blatt: §6.6 Ersteinrichtung + §6.7 Startdialog ===== */

        // G4: setup screen navigable from scaffold
        await showRoute("meetings");
        doc.getElementById("btn-open-setup").click();
        await sleep(80);
        check("G4 setup view reachable from Meetings scaffold",
              !doc.getElementById("view-meeting-einrichtung").hidden);
        check("§6.6 provider default 'Lokal' preselected",
              doc.querySelector('input[name="setup-provider"][value="lokal"]').checked);
        const moreOpts = doc.querySelector("#view-meeting-einrichtung details.more-options");
        check("§6.6 Custom sits under 'Weitere Optionen'",
              !!moreOpts && !moreOpts.open &&
              !!moreOpts.querySelector('input[name="setup-provider"][value="custom"]'));

        // §6.6 audio test with live-level mock
        doc.getElementById("btn-test-mic").click();
        await sleep(300);
        check("§6.6 mic test shows live level",
              Number(doc.getElementById("setup-mic-level").value) > 0);
        await sleep(2200);
        check("§6.6 mic test passes", /funktioniert/.test(doc.getElementById("result-mic").textContent));
        doc.getElementById("btn-test-sys").click();
        await sleep(2200);
        check("§6.6 system test confirms loopback",
              /Loopback empfängt/.test(doc.getElementById("result-sys").textContent));

        // §6.6 correction action on missing device
        doc.getElementById("sim-no-mic").checked = true;
        doc.getElementById("btn-test-mic").click();
        await sleep(50);
        check("§6.6 missing device yields fail status + correction action",
              /Kein Mikrofon erkannt/.test(doc.getElementById("result-mic").textContent) &&
              !doc.getElementById("setup-audio-hints").hidden &&
              !!doc.querySelector("#setup-audio-hints button[data-fix]"));
        doc.getElementById("sim-no-mic").checked = false;

        // §6.6 shortcut candidate availability
        await sleep(700);
        check("§6.6 shortcut candidate available",
              /verfügbar/.test(doc.getElementById("shortcut-cand-status").textContent));
        doc.getElementById("sim-shortcut-taken").checked = true;
        doc.getElementById("btn-shortcut-check").click();
        await sleep(700);
        check("§6.6 taken candidate offers alternatives",
              !doc.getElementById("shortcut-alternatives").hidden &&
              doc.querySelectorAll(".alt-pick").length >= 2);
        doc.getElementById("sim-shortcut-taken").checked = false;

        // §6.6 finish lands in compact start dialog
        doc.getElementById("btn-setup-finish").click();
        await sleep(100);
        check("§6.6 finish opens compact start dialog",
              !doc.getElementById("start-dialog").hidden);

        // G1: rows clickable, scoped pickers, state preserved
        const titleBefore = doc.getElementById("meeting-title-input").value;
        for (const row of ["mic", "sys", "provider", "lang"]) {
          doc.getElementById("row-" + row).click();
          await sleep(30);
          check("G1 row '" + row + "' opens scoped picker",
                !doc.getElementById("row-picker").hidden &&
                doc.querySelectorAll("#row-picker .picker-option").length > 0);
          doc.querySelector("#row-picker .picker-back").click();
          await sleep(30);
          check("G1 row '" + row + "' returns to intact dialog",
                doc.getElementById("row-picker").hidden === true &&
                !doc.getElementById("start-dialog").hidden);
        }
        check("G1 dialog state preserved (title unchanged)",
              doc.getElementById("meeting-title-input").value === titleBefore);

        // G2: 'Kein Projekt' selectable and visibly distinct
        doc.getElementById("project-chip").click();
        await sleep(30);
        const noneOpt = doc.querySelector("#project-picker .picker-none-opt");
        check("G2 'Kein Projekt' option present and dashed",
              !!noneOpt &&
              win.getComputedStyle(noneOpt).borderStyle === "dashed" &&
              /Eingang/.test(noneOpt.textContent));
        [...doc.querySelectorAll("#project-picker .picker-option")]
          .find((b) => b.textContent.indexOf("BDNA Club") !== -1).click();
        await sleep(30);
        check("G2 project selection reflects on chip",
              doc.getElementById("project-chip").textContent.trim() === "BDNA Club");
        // Picker bleibt nach einer Auswahl geöffnet – direkt „Kein Projekt“ wählen.
        doc.querySelector("#project-picker .picker-none-opt").click();
        await sleep(30);
        check("G2 'Kein Projekt' selectable again, chip unassigned style",
              doc.getElementById("project-chip").textContent.trim() === "Kein Projekt" &&
              doc.getElementById("project-chip").classList.contains("chip-none"));

        // G3: start disabled for mocked missing device, fixable in-place
        doc.getElementById("row-mic").click();
        await sleep(30);
        [...doc.querySelectorAll("#row-picker .picker-sim")]
          .find((b) => b.textContent.indexOf("Gerät entfernen") !== -1).click();
        await sleep(30);
        check("G3 start disabled while mic missing",
              doc.getElementById("btn-meeting-starten").disabled === true);
        check("G3 blocker names fix location",
              !doc.getElementById("start-blocker").hidden &&
              /Mikrofon/.test(doc.getElementById("start-blocker").textContent));
        check("G3 row shows attention state",
              /Aufmerksamkeit/.test(doc.getElementById("row-mic-value").textContent));
        [...doc.querySelectorAll("#row-picker .picker-option")]
          .find((b) => b.textContent.indexOf("Standardmikrofon") !== -1).click();
        await sleep(30);
        check("G3 fixed in place; start enabled, dialog intact",
              doc.getElementById("btn-meeting-starten").disabled === false &&
              !doc.getElementById("start-dialog").hidden);

        // G3: cloud provider without key
        doc.getElementById("row-provider").click();
        await sleep(30);
        [...doc.querySelectorAll("#row-picker .picker-option")]
          .find((b) => b.textContent.indexOf("Azure Cloud") !== -1).click();
        await sleep(30);
        check("G3 azure without key disables start",
              doc.getElementById("btn-meeting-starten").disabled === true);
        [...doc.querySelectorAll("#row-picker .picker-sim")]
          .find((b) => b.textContent.indexOf("Schlüssel hinzufügen") !== -1).click();
        await sleep(30);
        check("G3 adding key re-enables start",
              doc.getElementById("btn-meeting-starten").disabled === false);

        // Escape first closes only the picker
        doc.getElementById("row-lang").click();
        await sleep(30);
        doc.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
        await sleep(30);
        check("Escape closes picker but keeps dialog",
              doc.getElementById("row-picker").hidden === true &&
              !doc.getElementById("start-dialog").hidden);

        out.forEach((l) => { const d = document.createElement("div"); d.textContent = l; document.body.appendChild(d); });
        const summary = document.createElement("div");
        summary.id = "summary";
        summary.textContent = window.__failed ? "RESULT: FAIL" : "RESULT: PASS";
        document.body.appendChild(summary);
        document.title = summary.textContent;
      } catch (e) {
        const d = document.createElement("div");
        d.id = "harness-error";
        d.textContent = "HARNESS ERROR: " + (e && e.stack || e);
        document.body.appendChild(d);
        document.title = "HARNESS ERROR";
      }
    })();
  });
})();
</script>
</body>
</html>
