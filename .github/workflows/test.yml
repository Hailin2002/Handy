name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
  pull_request:
    paths:
      - "src-tauri/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature). Mirrors the apt
          # set transcribe.cpp's native-ci uses to build -DTRANSCRIBE_VULKAN=ON.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Install Rust toolchain with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Nothing in CI had ever run clippy across the ~55k lines of Rust here.
      # `-D warnings` is affordable because the tree is already clean: the first
      # full run surfaced 12 warnings, 7 of them mechanical (chunks_exact ->
      # as_chunks, a stray vec!, a unit expression) and 5 deliberate
      # (serial_guard held across .await, now carrying a justified allow).
      # Gating at zero keeps it that way instead of letting a warning backlog
      # accumulate until the lint is worthless.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # rustfmt is checked by `bun run format:check` in the code-quality job,
      # but that job only triggers on frontend paths — a backend-only PR never
      # reached it.
      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # The heuristic guard in the code-quality job compares command *names*.
      # This regenerates the bindings from the same specta_builder() the app
      # uses and diffs the result, so parameter and return *types* are covered
      # too. Possible at all only because the builder is no longer buried
      # inside `run()` behind a GUI launch.
      - name: Verify src/bindings.ts is regenerated
        working-directory: src-tauri
        run: cargo run --quiet --bin export_bindings

      - name: Fail if the bindings drifted
        run: |
          if ! git diff --exit-code -- src/bindings.ts; then
            echo "::error::src/bindings.ts is out of date. Run 'bun run bindings:generate' and commit the result."
            exit 1
          fi

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
