name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      # The bindings drift guard reads src-tauri/src/lib.rs and the log-hygiene
      # guard scans all of src-tauri/src, so backend-only commits must run this
      # job too.
      - "src-tauri/src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "vitest.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      # The bindings drift guard reads src-tauri/src/lib.rs and the log-hygiene
      # guard scans all of src-tauri/src, so backend-only commits must run this
      # job too.
      - "src-tauri/src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "vitest.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      # src/bindings.ts is only regenerated by a debug build at app startup, so
      # a command added without running `tauri dev` once would otherwise reach
      # main with the frontend calling a binding that does not exist.
      - name: Check Tauri bindings are in sync
        run: bun run check:bindings

      # tsc previously ran only as part of a full `tauri build`, which is far
      # too late and far too expensive to be the first signal on a type error.
      - name: Typecheck
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check

      - name: Run unit tests
        run: bun run test:unit

      # The log-hygiene guard has existed since transcript/credential leaks
      # became a concern, but it was wired into nothing: it is a PowerShell
      # script and this job runs on ubuntu-latest, so `bun run check` was never
      # reachable from CI. GitHub's Ubuntu images ship pwsh (PowerShell 7), and
      # the script deliberately avoids Add-Type and Windows-only APIs — it uses
      # only cmdlets and cross-platform .NET Core types ([regex], [char],
      # [string], [Console]).
      #
      # The self-test runs FIRST and is the safety net for that portability
      # claim: it seeds known violations into a temp directory and asserts they
      # are flagged, that clean samples are not, and that both suppression paths
      # work. If the guard silently misbehaves on Linux, this fails loudly
      # instead of reporting a clean scan that checked nothing.
      # Frontend counterpart to the PowerShell guard below. Its own self-test
      # runs first for the same reason: a guard that silently stops detecting
      # is worse than no guard, because it reads as a passing check.
      - name: Self-test the frontend log-hygiene guard
        run: node scripts/verify/check-frontend-log-hygiene.ts --self-test

      - name: Check frontend log hygiene
        run: bun run check:log-hygiene:frontend

      - name: Self-test the log-hygiene guard
        shell: pwsh
        run: ./scripts/verify/check-log-hygiene.ps1 -SelfTest

      - name: Check log hygiene
        shell: pwsh
        run: ./scripts/verify/check-log-hygiene.ps1
