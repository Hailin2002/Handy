name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      # The bindings drift guard reads src-tauri/src/lib.rs, so a backend-only
      # commit that adds a Tauri command has to run this job too.
      - "src-tauri/src/lib.rs"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "vitest.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      # The bindings drift guard reads src-tauri/src/lib.rs, so a backend-only
      # commit that adds a Tauri command has to run this job too.
      - "src-tauri/src/lib.rs"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - "vitest.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      # src/bindings.ts is only regenerated by a debug build at app startup, so
      # a command added without running `tauri dev` once would otherwise reach
      # main with the frontend calling a binding that does not exist.
      - name: Check Tauri bindings are in sync
        run: bun run check:bindings

      # tsc previously ran only as part of a full `tauri build`, which is far
      # too late and far too expensive to be the first signal on a type error.
      - name: Typecheck
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check

      - name: Run unit tests
        run: bun run test:unit
