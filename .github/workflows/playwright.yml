name: "Playwright"
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lock"
      - "playwright.config.*"
      - "tests/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # playwright.config.ts defines three projects: two Desktop Chrome ones
      # (dev server + production preview) and a Desktop Firefox one. Installing
      # only chromium would make the firefox project fail on a missing browser.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: bun run test:playwright

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
