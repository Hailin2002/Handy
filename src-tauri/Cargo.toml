[package]
name = "speak"
version = "1.0.0"
description = "Speak"
authors = ["cjpais"]
edition = "2021"
license = "MIT"
default-run = "speak"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speak_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the rev Cargo.lock already resolves. Without a rev, a force-push
# to the upstream branch silently changes what `cargo update` pulls into a
# binary that injects synthetic keystrokes.
rdev = { git = "https://github.com/rustdesk-org/rdev", rev = "a90dbe1172f8832f54c97c62e823c5a34af5fdfe" }
# Held at 0.16 by the rodio fork, not by our own code. `cjpais/rodio` (pinned
# below) depends on cpal 0.16, so moving the app to 0.17 puts two incompatible
# cpal versions in the graph and audio_feedback.rs then hands a `cpal::Device`
# across that boundary into rodio's `OutputStreamBuilder::from_device` — a type
# mismatch the compiler catches immediately.
#
# Bumping this means bumping the rodio fork first. Once that happens, expect
# deprecation warnings too: 0.17 deprecates `DeviceTrait::name()` in favour of
# `description()` (human-readable) and `id()` (stable across reboots and
# reconnects), which affects audio_feedback.rs and audio_toolkit/audio/device.rs.
# The `id()` migration is worth doing on its own merits — device identity today
# is a display name, which is neither stable nor unique.
cpal = "0.16.0"
anyhow = "1.0.95"
base64 = "0.22"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git", rev = "fed30292db417cb95305c118c0e1d804fb74cbff" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
# Stable meeting-session ids (plan §9 line 1151); v4 only, already resolved in
# Cargo.lock as a transitive dependency.
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false }
handy-keys = "0.3.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", rev = "9918f11ab3473135eb7865aa4a5d79d597e6e810", features = [
  "tokio",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# API keys live in the OS credential store where one is guaranteed
# (Windows Credential Manager / macOS Keychain). Linux falls back to a
# dedicated secrets file inside secret_store.rs — no keyring feature there,
# since sync-secret-service pulls in D-Bus build requirements that would
# complicate the Nix/Linux CI builds for marginal benefit.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "apple-native",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
# ONNX Runtime on Windows is CPU-only (no ort-directml), matching macOS/Linux.
# The DirectML EP was experimental and, more importantly, pulled in pyke's
# prebuilt ONNX Runtime which is compiled with a global /arch:AVX2 baseline that
# executes BMI2/AVX in a static initializer and crashes at process startup on any
# pre-Haswell CPU (Sandy/Ivy Bridge, older AMD). Dropping the feature means we
# link a baseline ONNX Runtime (dynamically, via ORT_LIB_LOCATION in build.yml)
# with proper runtime CPU dispatch. Base `transcribe-rs` (features = ["onnx"])
# is inherited here, so Parakeet/Moonshine/etc. still run on CPU.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# handy.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
transcribe-cpp = { version = "0.2.0", default-features = false, features = ["metal"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
libc = "0.2"
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (Handy #1710). `handy` = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
#
# Status checked 2026-08-27: tao #1274 IS merged upstream (2026-07-21), so the
# "repoint at upstream once #1274 merges" note above now reads as done — but it
# is not. The fix only ships in tao 0.36.0 (2026-07-29) and 0.37.0, while
# tauri-runtime-wry still requires `tao = "0.35"`. Removing this patch resolves
# straight back to upstream 0.35.3, which predates both fixes.
#
# Drop condition, stated precisely so it does not need re-deriving: this patch
# goes away when tauri-runtime-wry accepts tao >= 0.36. Verify with
# `cargo tree -p tao` after commenting the patch out — if it resolves to 0.36 or
# later, the fork is redundant.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
# Vendored cmake-rs with a local patch: honors CMAKE_BUILD_PARALLEL_LEVEL ahead
# of NUM_JOBS (which cargo always overwrites for build scripts). Required on
# Windows because MSBuild worker nodes (/m) fail the transcribe-cpp-sys build
# silently; .cargo/config.toml pins CMAKE_BUILD_PARALLEL_LEVEL=1 so the native
# build runs serially. See docs/meeting-mode-phase0-baseline.md section 2.3.
# Status checked 2026-08-27: still required. Upstream cmake-rs at HEAD (v0.1.58;
# this fork is 0.1.57) reads only NUM_JOBS for `--parallel`, and cargo
# overwrites NUM_JOBS for build scripts, so there is still no way to pin native
# parallelism from `[env]` without this patch.
#
# Drop condition: upstream honouring CMAKE_BUILD_PARALLEL_LEVEL ahead of
# NUM_JOBS. Check with
#   gh api repos/rust-lang/cmake-rs/contents/src/lib.rs -H "Accept: application/vnd.github.raw" | grep CMAKE_BUILD_PARALLEL_LEVEL
# and if it matches, replace this with a plain version requirement.
cmake = { path = "../vendor/cmake" }

[dev-dependencies]
tempfile = "3"
# Enables `tauri::test` (mock runtime/app) so settings persistence tests can
# exercise the real AppHandle-based update_settings path against an isolated
# temp-dir store. Feature unification only affects test builds.
tauri = { version = "2.11.5", features = ["test"] }
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
