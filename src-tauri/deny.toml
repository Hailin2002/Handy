# cargo-deny configuration.
#
# Why this exists: the crate graph here is large (native audio, ONNX, ggml,
# webview, HTTP) and nothing was watching it for advisories. This file is
# deliberately narrow — it gates on *security* and on license compatibility,
# not on duplicate-version tidiness, which in a Tauri tree produces noise that
# no one can act on.

[advisories]
# Fail on any crate with a known security advisory. Unmaintained crates are a
# warning rather than a failure: several are pulled in transitively by tauri and
# cpal, and blocking the build on someone else's archived repo would make the
# gate something people route around instead of fix.
yanked = "deny"
ignore = []

[licenses]
# The project ships under MIT. These are the permissive licenses compatible with
# distributing a closed or MIT-licensed binary.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "Unlicense",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# ring vendors BoringSSL-derived code under a bespoke notice; it reaches us
# through rustls via reqwest. Widely accepted for redistribution.
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
# Duplicate versions are a fact of life in this graph (tauri, cpal and the ONNX
# stack disagree on windows-sys, syn and friends). Warn so the information is
# available; do not fail, or the gate becomes noise.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Every git dependency is pinned to an exact rev in Cargo.toml. Allowing the
# hosts here — rather than allow-git per URL — keeps the list readable while
# still rejecting a dependency that appears from somewhere unexpected.
[sources.allow-org]
github = [
  "rustdesk-org",
  "cjpais",
  "ahkohd",
]
